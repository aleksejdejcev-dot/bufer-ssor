server {
    listen 80;
    server_name _;

    # Корневая директория статики SPA
    root /usr/share/nginx/html;
    index index.html;

    # Сжатие gzip для оптимизации передачи ресурсов
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Максимальный размер загружаемого тела запроса (для аудио/аватаров)
    client_max_body_size 50M;

    # 1. Проксирование API запросов (/api/)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 2. Проксирование REST-роутов FastAPI (/auth/, /legal/, /sessions/, /couples/, /users/, /docs и др.)
    location ~ ^/(auth|legal|sessions|couples|couple|conflict|payment|signal|mood|maintenance|history|users|me|health|docs|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 3. Кэширование статических ассетов Vite
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 4. Обслуживание статики SPA (React / Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

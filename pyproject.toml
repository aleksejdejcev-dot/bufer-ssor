[project]
name = "bufer-ssor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long
    "F401",  # unused imports
    "F841",  # unused variables
    "E402",  # module level import not at top
    "F541",  # f-string without placeholder
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "silent"
exclude = ["backend/tests/"]
disable_error_code = [
    "arg-type",
    "return-value",
    "index",
    "assignment",
    "call-arg",
    "attr-defined",
    "misc",
    "override",
    "call-overload",
    "var-annotated",
    "union-attr",
]

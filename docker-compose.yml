services:
  postgres:
    image: postgres:16-alpine
    container_name: buffer_ssor_postgres
    restart: unless-stopped
    expose:
      - "5432"
    ports:
      - "${POSTGRES_PORT_MAPPING:-127.0.0.1:5432:5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задай в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задай в .env}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?задай в .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?задай в .env}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./scripts/init_postgres.sh:/docker-entrypoint-initdb.d/init_postgres.sh:ro
    networks:
      app_network:
        aliases:
          - db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buffer_ssor_backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT_MAPPING:-127.0.0.1:8000:8000}"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-buffer_admin}:${POSTGRES_PASSWORD:-buffer_dev_pass}@postgres:5432/${POSTGRES_DB:-buffer_ssor}
      - TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL:-https://tg-proxy.aleksejdejcev62.workers.dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buffer_ssor_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

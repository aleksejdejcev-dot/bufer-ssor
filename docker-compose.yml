services:
  postgres:
    image: postgres:16-alpine
    container_name: buffer_ssor_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задай в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задай в .env}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?задай в .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?задай в .env}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./scripts/init_postgres.sh:/docker-entrypoint-initdb.d/init_postgres.sh:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buffer_ssor_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-buffer_admin}:${POSTGRES_PASSWORD:-buffer_dev_pass}@postgres:5432/${POSTGRES_DB:-buffer_ssor}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
